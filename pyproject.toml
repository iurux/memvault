[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memvault"
version = "0.1.0"
description = "Save the AI conversations you care about into a local, searchable SQLite vault. Ships an MCP server, importers for Claude/ChatGPT exports, and a local chat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ray Xu" }]
keywords = ["mcp", "llm", "rag", "sqlite", "ollama", "memory"]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
memvault = "memvault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
